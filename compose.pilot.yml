name: sitecontrol-pilot
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: sitecontrol
      POSTGRES_USER: sitecontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pilot-pg18:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitecontrol -d sitecontrol"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    ports: ["127.0.0.1:16379:6379"]
    volumes: ["pilot-redis:/data"]
    restart: unless-stopped
volumes:
  pilot-pg18: {}
  pilot-redis: {}
