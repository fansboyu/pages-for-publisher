name: sitecontrol-production
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: sitecontrol
      POSTGRES_USER: sitecontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: ["postgres-data:/var/lib/postgresql"]
    networks: ["backend"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitecontrol -d sitecontrol"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?required}"]
    volumes: ["redis-data:/data"]
    networks: ["backend"]
    restart: unless-stopped
  migrate:
    build: {context: ., dockerfile: pilot/Dockerfile}
    command: ["node", "pilot/db.mjs"]
    networks: ["backend"]
    environment:
      DATABASE_URL: postgres://sitecontrol:${POSTGRES_PASSWORD}@postgres:5432/sitecontrol
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: pilot/Dockerfile}
    env_file: .env
    environment:
      DATABASE_URL: postgres://sitecontrol:${POSTGRES_PASSWORD}@postgres:5432/sitecontrol
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DEMO_MODE: "false"
      COOKIE_SECURE: "true"
      TEMPLATE_IMPORT_ROOT: /imports
      DATA_ROOT: /data
      HOST: 0.0.0.0
      PORT: "3000"
      SERVE_FRONTEND: "false"
    volumes: ["platform-data:/data", "./customer-templates:/imports:ro"]
    expose: ["3000"]
    networks: ["edge", "backend"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    environment:
      API_UPSTREAM: api:3000
    ports: ["127.0.0.1:4418:8080"]
    networks: ["edge"]
    depends_on:
      api: {condition: service_started}
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: pilot/Dockerfile}
    command: ["node", "pilot/worker.mjs"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://sitecontrol:${POSTGRES_PASSWORD}@postgres:5432/sitecontrol
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DATA_ROOT: /data
    volumes: ["platform-data:/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    restart: unless-stopped
    networks: ["backend"]
networks:
  edge: {}
  backend: {}
volumes:
  postgres-data: {}
  redis-data: {}
  platform-data: {}
